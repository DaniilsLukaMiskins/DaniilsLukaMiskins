<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-label="Thanks for visiting. Let's build something together." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102538"/>
      <stop offset="0.55" stop-color="#14586B"/>
      <stop offset="1" stop-color="#16877D"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="waveFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="260" fill="url(#bg)"/>
  <rect width="1280" height="260" fill="url(#grid)"/>
  <circle cx="1090" cy="40" r="190" fill="url(#glowA)"/>
  <circle cx="170" cy="230" r="170" fill="url(#glowB)"/>

  <!-- faint code decoration, left -->
  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#FFFFFF" fill-opacity="0.16">
    <text x="40" y="52">#include &lt;iostream&gt;</text>
    <text x="40" y="76">int main() {</text>
    <text x="64" y="100">// keep learning</text>
    <text x="64" y="124">return 0;</text>
    <text x="40" y="148">}</text>
  </g>

  <!-- faint code decoration, right -->
  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#FFFFFF" fill-opacity="0.16">
    <text x="980" y="52">class Developer {</text>
    <text x="1004" y="76">string name;</text>
    <text x="1004" y="100">void Build() { }</text>
    <text x="1004" y="124">void Learn() { }</text>
    <text x="980" y="148">}</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="54" fill="#FFFFFF" fill-opacity="0.07" font-weight="700">
    <text x="215" y="215">{ }</text>
    <text x="1010" y="215">&lt;/&gt;</text>
  </g>

  <!-- main text -->
  <text x="640" y="108" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Thanks for visiting</text>
  <text x="440" y="152" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="20" fill="#7FE3D4" xml:space="preserve">&gt; let's build something together</text>
  <rect x="828" y="135" width="11" height="22" fill="#7FE3D4">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- waves -->
  <path d="M0 205 C 180 170, 340 240, 560 212 S 980 170, 1280 210 L1280 260 L0 260 Z" fill="url(#waveFill)"/>
  <path d="M0 232 C 220 205, 420 258, 680 235 S 1060 205, 1280 232 L1280 260 L0 260 Z" fill="#FFFFFF" fill-opacity="0.08"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
